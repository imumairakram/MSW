<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M&M Football Admin Portal | Club & Inventory Management</title>
    <link rel="icon" type="image/png" href="assets/Sample Logo.png">
    <link rel="shortcut icon" href="assets/Sample Logo.png">
    <link rel="apple-touch-icon" href="assets/Sample Logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .admin-auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-main) 0%, #e2e8f0 100%);
            padding: 20px;
        }

        .admin-card {
            background: #ffffff;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            text-align: center;
        }

        .admin-logo-box {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-lg);
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }
    </style>
</head>

<body>
    <div class="admin-auth-page">
        <div class="admin-card" id="card">
            <div class="admin-logo-box">
                <i class="fas fa-user-shield"></i>
            </div>

            <h2 style="font-size: 24px; margin-bottom: 6px;">Football Admin Portal</h2>
            <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 28px;">M&M Football Store & Kit Administration</p>

            <form id="loginForm" style="text-align: left;">
                <div class="form-group">
                    <label class="form-label" for="username">Admin Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. mm_admin or admin" required autocomplete="username">
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
                        <a href="javascript:void(0);" onclick="openForgotModal()" style="font-size:12.5px; color:var(--primary); font-weight:500;">Forgot Password?</a>
                    </div>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" onclick="togglePassword('password', this)" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    Authenticate <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div style="margin-top: 24px; font-size: 13px; color: var(--text-muted);">
                <a href="index.html" style="color: var(--text-secondary);"><i class="fas fa-arrow-left"></i> Return to Main Store</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div class="modal-icon alert-icon"><i class="fas fa-shield-alt"></i></div>
            <h3>Admin Recovery</h3>

            <div id="step1">
                <p>Enter your administrator username to receive a security reset OTP.</p>
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="text" id="recoverUser" class="form-input" placeholder="Administrator Username" required>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn btn-cancel" onclick="closeForgotModal()">Cancel</button>
                    <button class="modal-btn btn-confirm" id="sendOtpBtn" onclick="sendAdminOTP()">Send Code</button>
                </div>
            </div>

            <div id="step2" style="display:none;">
                <p style="color:var(--success); font-weight:500;">Code sent to admin recovery email!</p>
                <div class="form-group" style="margin-bottom:12px;">
                    <input type="text" id="otpCode" class="form-input" placeholder="Enter 6-digit OTP" required>
                </div>
                <div class="form-group" style="margin-bottom:20px;">
                    <input type="password" id="newPass" class="form-input" placeholder="New Password" required>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn btn-cancel" onclick="closeForgotModal()">Cancel</button>
                    <button class="modal-btn btn-confirm" id="resetBtn" onclick="resetAdminPass()">Update Password</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="errorModal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div class="modal-icon error-icon"><i class="fas fa-times"></i></div>
            <h3 id="errTitle">Authentication Failed</h3>
            <p id="errMsg">Invalid username or password.</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-confirm" onclick="closeModal()">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();

                if (result.success) {
                    btn.innerHTML = '<i class="fas fa-check"></i> Redirecting...';
                    localStorage.setItem('admin_token', result.token);
                    setTimeout(() => { window.location.href = 'admin.html'; }, 700);
                } else {
                    showErrorModal("Access Denied", result.message || "Invalid credentials.");
                    btn.innerHTML = 'Authenticate <i class="fas fa-arrow-right"></i>';
                    btn.disabled = false;
                }
            } catch (err) {
                showErrorModal("Server Error", "Could not connect to authentication service.");
                btn.innerHTML = 'Authenticate <i class="fas fa-arrow-right"></i>';
                btn.disabled = false;
            }
        });

        function showErrorModal(title, msg) {
            document.getElementById('errTitle').innerText = title;
            document.getElementById('errMsg').innerText = msg;
            document.getElementById('errorModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('errorModal').style.display = 'none';
        }

        function openForgotModal() {
            document.getElementById('forgotModal').style.display = 'flex';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }

        async function sendAdminOTP() {
            const username = document.getElementById('recoverUser').value.trim();
            const btn = document.getElementById('sendOtpBtn');
            if (!username) return alert("Please enter username.");

            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/admin/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    alert("Admin user not found.");
                }
            } catch (e) {
                alert("Server connection error.");
            } finally {
                btn.innerText = "Send Code";
                btn.disabled = false;
            }
        }

        async function resetAdminPass() {
            const username = document.getElementById('recoverUser').value.trim();
            const otp = document.getElementById('otpCode').value.trim();
            const newPassword = document.getElementById('newPass').value;
            const btn = document.getElementById('resetBtn');

            if (!otp || !newPassword) return alert("Please fill all fields.");

            btn.innerText = "Updating...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/admin/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, otp, newPassword })
                });
                const data = await res.json();

                if (data.success) {
                    closeForgotModal();
                    alert("Password updated! Please log in.");
                } else {
                    alert(data.message || "Invalid OTP code.");
                }
            } catch (e) {
                alert("Server error.");
            } finally {
                btn.innerText = "Update Password";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
